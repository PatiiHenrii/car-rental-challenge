spring.application.name=rental
server.port=${PORT:8081}
server.servlet.context-path=/rentals

# H2 in-memory database, recreated on every start and seeded from data.sql
spring.datasource.url=jdbc:h2:mem:rental;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# API contract uses snake_case JSON (see assignment PDF)
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.mvc.problemdetails.enabled=true
